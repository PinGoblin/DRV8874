[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pingoblin-motor"
version = "0.1.0"
description = "Control library for the PinGoblin DRV8874 dual DC motor driver on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pi = ["gpiozero>=2.0"]
ads1115 = ["pingoblin-ads1115 @ git+https://github.com/PinGoblin/ADS1115#subdirectory=python"]
hwpwm = ["rpi-hardware-pwm>=0.2"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pingoblin_motor"]
