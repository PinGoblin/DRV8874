<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 528" role="img" aria-label="J3 logic header pinout" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="920" height="528" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">J3 pinout: pins 3–6 change function with the PMODE jumper (JP1)</text>
<text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">Top view as placed: left edge, pin 10 at the top, pin 1 (square pad) at the bottom. Outline not to scale.</text>
<rect x="24" y="64" width="12" height="12" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="42" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Power</text>
<rect x="99.0" y="64" width="12" height="12" rx="0" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="117.0" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Input (host to board)</text>
<rect x="279.6" y="64" width="12" height="12" rx="0" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="297.6" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Output (board to host)</text>
<rect x="466.8" y="64" width="12" height="12" rx="0" fill="#ececec" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/>
<text x="484.8" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Depends on JP1</text>
<rect x="16" y="252" width="646" height="128" rx="6" fill="#ececec" fill-opacity="1" stroke="none" stroke-width="0"/>
<text x="150" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PH/EN mode (default)</text>
<text x="150" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 pads 1–2 bridged</text>
<text x="336" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PWM mode (IN1/IN2)</text>
<text x="336" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 pads 2–3 bridged</text>
<text x="466" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">Four-motor mode</text>
<text x="466" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 all pads open</text>
<line x1="24" y1="122" x2="660" y2="122" stroke="#c9c9c9"/>
<rect x="660" y="120" width="24" height="328" rx="3" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"/>
<text x="672" y="112" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">J3</text>
<circle cx="672" cy="140" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="650" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">10</text>
<text x="24" y="144" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nFAULT</text>
<text x="104" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="150" y="144" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = fault or limiting</text>
<text x="336" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="144" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = driver fault</text>
<circle cx="672" cy="172" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="650" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">9</text>
<text x="24" y="176" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nSLEEP</text>
<text x="104" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="150" y="176" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low / open = sleep</text>
<text x="336" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="176" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">same: GPIO only *</text>
<circle cx="672" cy="204" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="650" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">8</text>
<text x="24" y="208" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_ISENSE</text>
<text x="104" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="150" y="208" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">B current, 0.675 V/A</text>
<text x="336" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="208" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">B1 + B2 current</text>
<circle cx="672" cy="236" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="650" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">7</text>
<text x="24" y="240" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_ISENSE</text>
<text x="104" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="150" y="240" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">A current, 0.675 V/A</text>
<text x="336" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="240" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">A1 + A2 current</text>
<circle cx="672" cy="268" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="650" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">6</text>
<text x="24" y="272" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_PH</text>
<text x="104" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="150" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B direction</text>
<text x="336" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor B</text>
<text x="466" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B2, low = on</text>
<circle cx="672" cy="300" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="650" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">5</text>
<text x="24" y="304" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_EN</text>
<text x="104" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="150" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B on / speed (PWM)</text>
<text x="336" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor B</text>
<text x="466" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B1, low = on</text>
<circle cx="672" cy="332" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="650" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">4</text>
<text x="24" y="336" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_PH</text>
<text x="104" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="150" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A direction</text>
<text x="336" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor A</text>
<text x="466" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A2, low = on</text>
<circle cx="672" cy="364" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="650" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">3</text>
<text x="24" y="368" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_EN</text>
<text x="104" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="150" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A on / speed (PWM)</text>
<text x="336" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor A</text>
<text x="466" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A1, low = on</text>
<circle cx="672" cy="396" r="8" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="650" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">2</text>
<text x="24" y="400" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">VLOGIC</text>
<text x="104" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="150" y="400" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Logic supply in, 3.3–5 V</text>
<text x="336" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<rect x="664" y="420" width="16" height="16" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="650" y="432" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="end">1</text>
<text x="24" y="432" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">GND</text>
<text x="104" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="150" y="432" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Ground, common with host</text>
<text x="336" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="466" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="24" y="476" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">nSLEEP is pulled low on the board: drive it high to run. Give each board its own nFAULT GPIO.</text>
<text x="24" y="492" font-size="11.5" font-weight="600" fill="#b3261e" text-anchor="start">* Four-motor mode: an undriven input turns its motor ON with no current limit whenever the drivers</text>
<text x="24" y="508" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">are awake. Wire nSLEEP to a GPIO only; do not also connect it to VLOGIC. See Four-motor mode.</text>
<rect x="688" y="88" width="212" height="420" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"/>
<rect x="698" y="100" width="112" height="34" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="754.0" y="122.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="middle">J1 / J2 power in</text>
<rect x="818" y="98" width="72" height="40" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="854.0" y="115.0" font-size="12" font-weight="600" fill="#5f5f5f" text-anchor="middle">J6</text>
<text x="854.0" y="131.0" font-size="11" font-weight="400" fill="#5f5f5f" text-anchor="middle">VM ×4</text>
<rect x="698" y="172" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="746.0" y="199.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="middle">U1 motor A</text>
<rect x="818" y="172" width="72" height="56" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="854.0" y="197.0" font-size="12" font-weight="600" fill="#5f5f5f" text-anchor="middle">J4</text>
<text x="854.0" y="213.0" font-size="11" font-weight="400" fill="#5f5f5f" text-anchor="middle">A2 / A1</text>
<rect x="698" y="322" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="746.0" y="349.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="middle">U2 motor B</text>
<rect x="818" y="322" width="72" height="56" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="854.0" y="347.0" font-size="12" font-weight="600" fill="#5f5f5f" text-anchor="middle">J5</text>
<text x="854.0" y="363.0" font-size="11" font-weight="400" fill="#5f5f5f" text-anchor="middle">B2 / B1</text>
<rect x="698" y="456" width="192" height="36" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="794.0" y="479.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="middle">SW1–SW4 test buttons</text>
<text x="794" y="264" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="middle">Board A, top view</text>
</svg>
