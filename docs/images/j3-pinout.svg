<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" role="img" aria-label="J3 logic header pinout" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="760" height="532" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">J3 pinout: pins 3–6 change function with the PMODE jumper (JP1)</text>
<text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">Top view as placed: left edge, pin 10 at the top, pin 1 (square pad) at the bottom. Outline not to scale.</text>
<rect x="24" y="64" width="12" height="12" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="42" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Power</text>
<rect x="100" y="64" width="12" height="12" rx="0" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="118" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Input (host to board)</text>
<rect x="256" y="64" width="12" height="12" rx="0" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="274" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Output (board to host)</text>
<rect x="420" y="64" width="12" height="12" rx="0" fill="#ececec" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/>
<text x="438" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Depends on JP1</text>
<rect x="16" y="252" width="498" height="128" rx="6" fill="#ececec" fill-opacity="1" stroke="none" stroke-width="0"/>
<text x="154" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PH/EN mode (default)</text>
<text x="154" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 pads 1–2 bridged</text>
<text x="342" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PWM mode (IN1/IN2)</text>
<text x="342" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 pads 2–3 bridged</text>
<line x1="24" y1="122" x2="510" y2="122" stroke="#c9c9c9"/>
<rect x="516" y="88" width="220" height="420" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"/>
<text x="626" y="254" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="middle">Board A, top view</text>
<rect x="570" y="100" width="150" height="34" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="645.0" y="121.0" font-size="13" font-weight="400" fill="#5f5f5f" text-anchor="middle">J1 / J2 power in</text>
<rect x="572" y="150" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="620.0" y="176.0" font-size="13" font-weight="400" fill="#5f5f5f" text-anchor="middle">U1 motor A</text>
<rect x="676" y="156" width="56" height="56" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="704.0" y="180" font-size="13" font-weight="600" fill="#5f5f5f" text-anchor="middle">J4</text>
<text x="704.0" y="198" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="middle">Motor A</text>
<rect x="572" y="320" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="620.0" y="346.0" font-size="13" font-weight="400" fill="#5f5f5f" text-anchor="middle">U2 motor B</text>
<rect x="676" y="326" width="56" height="56" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="704.0" y="350" font-size="13" font-weight="600" fill="#5f5f5f" text-anchor="middle">J5</text>
<text x="704.0" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="middle">Motor B</text>
<rect x="566" y="456" width="166" height="36" rx="6" fill="none" fill-opacity="1" stroke="#c9c9c9" stroke-width="1.25"/>
<text x="649.0" y="478.0" font-size="13" font-weight="400" fill="#5f5f5f" text-anchor="middle">SW1-SW4 test buttons</text>
<rect x="522" y="120" width="24" height="328" rx="3" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"/>
<text x="534" y="112" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">J3</text>
<circle cx="534" cy="140" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="508" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">10</text>
<text x="24" y="144" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nFAULT</text>
<text x="104" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="154" y="144" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = fault or limiting</text>
<text x="342" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="534" cy="172" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="508" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">9</text>
<text x="24" y="176" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nSLEEP</text>
<text x="104" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="154" y="176" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = sleep, motors coast</text>
<text x="342" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="534" cy="204" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="508" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">8</text>
<text x="24" y="208" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_ISENSE</text>
<text x="104" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="154" y="208" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">B current, 0.675 V/A</text>
<text x="342" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="534" cy="236" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="508" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">7</text>
<text x="24" y="240" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_ISENSE</text>
<text x="104" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="154" y="240" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">A current, 0.675 V/A</text>
<text x="342" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="534" cy="268" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="508" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">6</text>
<text x="24" y="272" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_PH</text>
<text x="104" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="154" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B direction</text>
<text x="342" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor B</text>
<circle cx="534" cy="300" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="508" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">5</text>
<text x="24" y="304" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_EN</text>
<text x="104" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="154" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B on / speed (PWM)</text>
<text x="342" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor B</text>
<circle cx="534" cy="332" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="508" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">4</text>
<text x="24" y="336" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_PH</text>
<text x="104" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="154" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A direction</text>
<text x="342" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor A</text>
<circle cx="534" cy="364" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="508" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">3</text>
<text x="24" y="368" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_EN</text>
<text x="104" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="154" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A on / speed (PWM)</text>
<text x="342" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor A</text>
<circle cx="534" cy="396" r="8" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="508" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">2</text>
<text x="24" y="400" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">VLOGIC</text>
<text x="104" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="154" y="400" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Logic supply in, 3.3–5 V</text>
<text x="342" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<rect x="526" y="420" width="16" height="16" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="508" y="432" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="end">1</text>
<text x="24" y="432" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">GND</text>
<text x="104" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="154" y="432" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Ground, common with host</text>
<text x="342" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
</svg>