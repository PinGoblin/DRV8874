<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="J3 logic header pinout" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="520" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">J3 pinout: Pins 3–6 change function with the PMODE jumper (JP1)</text>
<text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">Left edge of the board. Pin 10 at the top, pin 1 (square pad) at the bottom.</text>
<rect x="24" y="64" width="12" height="12" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="42" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Power</text>
<rect x="99.0" y="64" width="12" height="12" rx="0" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="117.0" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Input (host to board)</text>
<rect x="279.6" y="64" width="12" height="12" rx="0" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="297.6" y="74" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Output (board to host)</text>
<text x="278" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PH/EN mode (default)</text>
<text x="278" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 open</text>
<text x="474" y="100" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">PWM mode (IN1/IN2)</text>
<text x="474" y="114" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">JP1 bridged</text>
<line x1="24" y1="122" x2="668" y2="122" stroke="#c9c9c9"/>
<rect x="668" y="120" width="24" height="328" rx="3" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"/>
<text x="680" y="112" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">J3</text>
<circle cx="680" cy="140" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="658" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">10</text>
<text x="24" y="144" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nFAULT</text>
<text x="136" y="144" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="278" y="144" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = driver fault</text>
<text x="474" y="144" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="680" cy="172" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="658" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">9</text>
<text x="24" y="176" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">nSLEEP</text>
<text x="136" y="176" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="278" y="176" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Low = sleep (pulled high)</text>
<text x="474" y="176" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="680" cy="204" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="658" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">8</text>
<text x="24" y="208" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_ISENSE</text>
<text x="136" y="208" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="278" y="208" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">B current, 0.45 V/A</text>
<text x="474" y="208" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="680" cy="236" r="8" fill="#19a979" fill-opacity="0.25" stroke="#19a979" stroke-width="1.5"/>
<text x="658" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">7</text>
<text x="24" y="240" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_ISENSE</text>
<text x="136" y="240" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">out</text>
<text x="278" y="240" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">A current, 0.45 V/A</text>
<text x="474" y="240" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<circle cx="680" cy="268" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="658" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">6</text>
<text x="24" y="272" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_PH / B_IN2</text>
<text x="136" y="272" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="272" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="278" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B direction</text>
<text x="474" y="272" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor B</text>
<circle cx="680" cy="300" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="658" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">5</text>
<text x="24" y="304" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">B_EN / B_IN1</text>
<text x="136" y="304" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">(Optional)</text>
<text x="232" y="304" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="278" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor B on / speed (PWM)</text>
<text x="474" y="304" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor B</text>
<circle cx="680" cy="332" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="658" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">4</text>
<text x="24" y="336" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_PH / A_IN2</text>
<text x="136" y="336" font-size="12" font-weight="600" fill="#1f1f1f" text-anchor="start">(Required)</text>
<text x="232" y="336" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="278" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A direction</text>
<text x="474" y="336" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN2, motor A</text>
<circle cx="680" cy="364" r="8" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="1.5"/>
<text x="658" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">3</text>
<text x="24" y="368" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">A_EN / A_IN1</text>
<text x="136" y="368" font-size="12" font-weight="600" fill="#1f1f1f" text-anchor="start">(Required)</text>
<text x="232" y="368" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">in</text>
<text x="278" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Motor A on / speed (PWM)</text>
<text x="474" y="368" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">IN1, motor A</text>
<circle cx="680" cy="396" r="8" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="658" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="end">2</text>
<text x="24" y="400" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">VLOGIC</text>
<text x="136" y="400" font-size="12" font-weight="600" fill="#1f1f1f" text-anchor="start">(Required)</text>
<text x="232" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="278" y="400" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Logic supply in, 3.0–5.25 V</text>
<text x="474" y="400" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<rect x="672" y="420" width="16" height="16" rx="0" fill="#2f6fd6" fill-opacity="0.25" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="658" y="432" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="end">1</text>
<text x="24" y="432" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">GND</text>
<text x="136" y="432" font-size="12" font-weight="600" fill="#1f1f1f" text-anchor="start">(Required)</text>
<text x="232" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">power</text>
<text x="278" y="432" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Ground, common with host</text>
<text x="474" y="432" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">same</text>
<text x="24" y="470" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="start">Minimum for one motor: Pins 1–4 (4 wires), the motor supply (2 wires or one XT30 plug) and the motor (2 wires).</text>
<text x="24" y="492" font-size="11.5" font-weight="400" fill="#5f5f5f" text-anchor="start">Give each board its own nFAULT GPIO. nSLEEP can be shared between boards.</text>
</svg>
